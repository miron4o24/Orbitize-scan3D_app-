services:
  backend:
    build: .
    image: orbitize-backend
    ports:
      - "${PORT:-8000}:8000"
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in backend/.env}
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-1600}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-600}
    volumes:
      - orbitize-data:/data
    restart: unless-stopped
    # Keep the host alive if a big scan needs more RAM than available; the job then fails with an OOM message.
    mem_limit: ${MEM_LIMIT:-4g}

volumes:
  orbitize-data:
